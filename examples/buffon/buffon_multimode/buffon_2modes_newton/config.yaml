defaults: ../_base.yaml

# Same two-mode buffon as ../buffon_2modes (pump optimised to lase modes 1, 5),
# but solved with the operator-level full_salt_newton instead of linear -- the
# real buffon network runs through it in a few minutes (the oversampled
# operator is bounded by intensity_oversample_node_cap, NOT by the cavity
# length). Raise the cap / resolution for more within-edge accuracy at more cost.
plot_passive_edge_size: 100.0
plot_passive_n_modes: 12

lasing_modes_id: [1, 5]

intensity_method: full_salt_newton
salt_D0_steps: 10
intensity_oversample_node_cap: 30000   # ~lambda/4 on this graph; default 3000 is faster/coarser
